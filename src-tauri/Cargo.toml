[package]
name = "iridium-remote"
version = "0.1.0"
description = "Iridium Remote desktop SSH client"
authors = ["iridiumcao"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "iridium_remote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
anyhow = "1.0"
chrono = "0.4"
keyring = "3.6.3"
portable-pty = "0.9.0"
regex = "1.11"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-log = "2"
uuid = { version = "1.18.1", features = ["v4", "fast-rng"] }
