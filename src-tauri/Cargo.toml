[package]
name = "iridium-remote"
version = "0.1.1"
description = "Iridium Remote desktop SSH client"
authors = ["iridiumcao"]
license = "Apache-2.0"
repository = "https://github.com/iridiumcao/iridium-remote"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "iridium_remote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
anyhow = "1.0"
chrono = "0.4"
keyring = "3.6.3"
portable-pty = "0.9.0"
regex = "1.11"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
russh = { version = "0.60.2", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-config = "0.58.0"
russh-sftp = "2.1.2"
rusqlite = { version = "0.37.0", features = ["bundled"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.52.1", features = ["fs", "io-util", "time"] }
uuid = { version = "1.18.1", features = ["v4", "fast-rng"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
