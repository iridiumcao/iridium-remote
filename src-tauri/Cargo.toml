[package]
name = "iridium-remote"
version = "0.1.5"
description = "Iridium Remote desktop SSH client"
authors = ["iridiumcao"]
license = "Apache-2.0"
repository = "https://github.com/iridiumcao/iridium-remote"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "iridium_remote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aes-gcm = "0.11.0-rc"
anyhow = "1.0"
argon2 = { version = "0.5.3", features = ["std"] }
base64 = "0.22.1"
chrono = "0.4"
iana-time-zone = "0.1.65"
keyring = "4.0.1"
keyring-core = "1.0.0"
portable-pty = "0.9.0"
rand = "0.10.1"
regex = "1.12"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
russh = { version = "0.62.1", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-config = "0.58.0"
russh-sftp = "2.3.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.52.3", features = ["fs", "io-util", "time"] }
uuid = { version = "1.20.0", features = ["v4", "fast-rng"] }
zstd = "0.13.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
