[package]
name = "iridium-remote"
version = "0.1.7"
description = "Iridium Remote desktop SSH client"
authors = ["iridiumcao"]
license = "Apache-2.0"
repository = "https://github.com/iridiumcao/iridium-remote"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "iridium_remote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0"
argon2 = { version = "0.5.3", features = ["std"] }
base64 = "0.23.1"
chrono = "0.4"
iana-time-zone = "0.1.65"
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }
portable-pty = "0.9.0"
rand = "0.10.3"
regex = "1.13"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-config = "0.58.0"
russh-sftp = "3.0.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.53.3", features = ["fs", "io-util", "sync", "time"] }
uuid = { version = "1.28.0", features = ["v4", "fast-rng"] }
zstd = "0.14.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt"] }
