name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release tag and app versions
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release workflows must run from a version tag like v0.1.5."
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(node -e "const fs = require('node:fs'); const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8'); const pkgSection = cargo.split(/\\r?\\n\\r?\\n/)[0]; const match = pkgSection.match(/^version = \\\"([^\\\"]+)\\\"/m); if (!match) process.exit(1); process.stdout.write(match[1]);")"

          test "${tag_version}" = "${package_version}"
          test "${tag_version}" = "${tauri_version}"
          test "${tag_version}" = "${cargo_version}"

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

  publish:
    name: Publish ${{ matrix.name }}
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
            artifactSuffix: windows_x64
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
            artifactSuffix: macos_aarch64
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
            artifactSuffix: macos_x64
          - name: Ubuntu x64
            platform: ubuntu-22.04
            args: ""
            artifactSuffix: ubuntu_x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release bundles
        id: tauri
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Iridium Remote ${{ github.ref_name }}
          releaseBody: |
            Cross-platform release bundles for Iridium Remote.

            Included assets:
            - Windows: NSIS installer and MSI package
            - macOS: app bundle and DMG package
            - Ubuntu: DEB and AppImage bundles

            Important install notes for the current unsigned release:
            - Windows: the installer is not code-signed yet, so SmartScreen may warn before the installer starts. Download only from this GitHub release and, if you trust it, click `More info` -> `Run anyway`.
            - macOS upgrades: if Finder asks whether to replace an existing `Iridium Remote.app`, choose `Replace`.
            - macOS first launch: current macOS builds are not signed / notarized yet, so Gatekeeper may show a damaged-app warning. After copying to `/Applications`, click `Cancel`, run `xattr -cr /Applications/Iridium\ Remote.app`, then relaunch.
            - macOS saved passwords: the first real use of a saved password may trigger a Keychain permission prompt because credentials are stored in `iridium-remote`.
          generateReleaseNotes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          releaseDraft: false
          args: ${{ matrix.args }}
          assetNamePattern: iridium-remote_[version]_[platform]_[arch][_setup][ext]

      - name: Prepare workflow artifact paths
        id: artifact-paths
        if: steps.tauri.outputs.artifactPaths != '[]'
        shell: bash
        run: |
          {
            echo 'paths<<EOF'
            node -e "for (const artifactPath of JSON.parse(process.argv[1])) console.log(artifactPath)" '${{ steps.tauri.outputs.artifactPaths }}'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        if: steps.tauri.outputs.artifactPaths != '[]'
        uses: actions/upload-artifact@v7
        with:
          name: iridium-remote_${{ github.ref_name }}_${{ matrix.artifactSuffix }}
          if-no-files-found: error
          path: ${{ steps.artifact-paths.outputs.paths }}
